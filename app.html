<!-- ═══════════════════════════════════════════
  MOBILE LYRICS FIX — paste before </body>
  Fixes: stamp opens full-screen overlay so
  keyboard never covers the input or buttons
═══════════════════════════════════════════ -->
<style id="mobLyrFix">
/* ── Full-screen input overlay ── */
#mlyr-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:9995;
  background:#04040e;
  flex-direction:column;
}
#mlyr-overlay.open{display:flex}

/* Top bar */
#mlyr-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  background:#07071a;
  border-bottom:1px solid #1a1a2a;
  flex-shrink:0;
}
#mlyr-top-title{font-size:15px;font-weight:700;color:#e2e8f0}
#mlyr-close-btn{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.06);border:none;
  color:#64748b;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* Time badge */
#mlyr-time-badge{
  margin:16px 16px 0;
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(124,58,237,.15);
  border:1px solid rgba(124,58,237,.4);
  border-radius:20px;padding:6px 14px;
  font-size:13px;font-weight:700;color:#a78bfa;
  align-self:flex-start;
}
#mlyr-time-dot{
  width:8px;height:8px;border-radius:50%;
  background:#7c3aed;animation:mlyrPulse 1s infinite;
}
@keyframes mlyrPulse{0%,100%{opacity:1}50%{opacity:.3}}

/* The input */
#mlyr-input-wrap{
  padding:14px 16px 10px;flex-shrink:0;
}
#mlyr-text-in{
  width:100%;
  /* font-size MUST be 16px+ on iOS to prevent zoom */
  font-size:18px;
  font-weight:500;
  line-height:1.5;
  padding:16px;
  background:#0e0e28;
  border:2px solid #7c3aed;
  border-radius:14px;
  color:#f0f4ff;
  font-family:system-ui,-apple-system,sans-serif;
  outline:none;
  resize:none;
  -webkit-appearance:none;
  caret-color:#a78bfa;
  min-height:90px;
  /* stick to top of screen so keyboard never covers it */
}
#mlyr-text-in::placeholder{color:#334155}
#mlyr-text-in:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(124,58,237,.2)}

/* Hint below input */
#mlyr-hint{
  margin:0 16px 10px;
  font-size:12px;color:#475569;line-height:1.5;
}
#mlyr-hint strong{color:#a78bfa}

/* Save / Cancel buttons */
#mlyr-btns{
  display:flex;gap:10px;
  padding:0 16px 14px;
  flex-shrink:0;
}
#mlyr-save{
  flex:1;padding:18px;
  border:none;border-radius:14px;
  background:linear-gradient(135deg,#7c3aed,#5b21b6);
  color:#fff;
  font-family:system-ui,-apple-system,sans-serif;
  font-size:17px;font-weight:800;
  cursor:pointer;
  box-shadow:0 4px 20px rgba(124,58,237,.45);
  transition:transform .1s;
}
#mlyr-save:active{transform:scale(.97)}
#mlyr-cancel{
  padding:18px 20px;
  border:1.5px solid #1e1e3a;border-radius:14px;
  background:transparent;color:#475569;
  font-family:system-ui,-apple-system,sans-serif;
  font-size:15px;cursor:pointer;
}

/* Lyrics list at bottom of overlay */
#mlyr-list-wrap{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 16px 20px;
  border-top:1px solid #1a1a2a;
  margin-top:10px;
}
#mlyr-list-head{
  font-size:10px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:#475569;
  padding:14px 0 8px;
  display:flex;align-items:center;justify-content:space-between;
}
#mlyr-list-head span{color:#7c3aed}
#mlyr-list-rows{display:flex;flex-direction:column;gap:7px}

.ml-row{
  display:flex;align-items:center;gap:10px;
  padding:13px 14px;border-radius:12px;
  background:#0e0e28;border:1px solid #1a1a2a;

.ml-row.ml-now{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.07)}

}
.ml-txt{
  flex:1;font-size:14px;color:#c4cde0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ml-del{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);
  color:#f87171;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.ml-empty{
  text-align:center;padding:24px 14px;
  border:2px dashed #1a1a2a;border-radius:12px;
  font-size:13px;color:#334155;line-height:1.8;
}
.ml-empty strong{color:#475569}

/* ── Replace the mobile sheet stamp instruction ── */
#bs-lyrics .le{
  font-size:13px;color:#475569;line-height:1.65;

/* Mobile stamp button inside the bs-lyrics sheet */
#mob-quick-stamp{

/* Mini player in the lyrics sheet */
#mob-lyr-player{
  display:flex;align-items:center;gap:10px;
  padding:13px 14px;
  background:#07071a;
  border:1px solid #1a1a2a;
  border-radius:12px;
  margin-bottom:10px;
}
#mob-lyr-playbtn{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#7c3aed,#5b21b6);
  border:none;color:#fff;font-size:20px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(124,58,237,.4);
  -webkit-tap-highlight-color:transparent;
}
#mob-lyr-playbtn:active{transform:scale(.92)}
#mob-lyr-info{flex:1;min-width:0}
#mob-lyr-clock{
  font-size:16px;font-weight:800;font-family:monospace;
  color:#e2e8f0;margin-bottom:5px;
}
#mob-lyr-bar{
  height:6px;background:#1a1a2a;border-radius:3px;
  cursor:pointer;touch-action:none;position:relative;
}
#mob-lyr-fill{
  height:100%;background:linear-gradient(90deg,#7c3aed,#06b6d4);
  border-radius:3px;pointer-events:none;width:0%;
}

@media(min-width:769px){
  #mob-quick-stamp,#mob-lyr-player,#mob-lyr-player+*,
  #mlyr-overlay{display:none!important}
}
</style>

<!-- Full-screen lyric input overlay -->
<div id="mlyr-overlay">
  <div id="mlyr-top">
    <div id="mlyr-top-title">🎤 Add Lyric</div>
    <button id="mlyr-close-btn" onclick="mlyrClose()">✕</button>
  </div>

  <div id="mlyr-time-badge">
    <div id="mlyr-time-dot"></div>
    <span id="mlyr-time-txt">at 0:00</span>
  </div>

  <div id="mlyr-input-wrap">
    <textarea id="mlyr-text-in"
      placeholder="Type the lyric line here…"
      rows="3"
      autocomplete="off"
      autocorrect="on"
      autocapitalize="sentences"
      spellcheck="true"
      inputmode="text"
    ></textarea>
  </div>

  <div id="mlyr-hint">
    <strong>Tip:</strong> Type clearly — this exact text will appear on your video.
    Tap <strong>Save</strong> when done.
  </div>

  <div id="mlyr-btns">
    <button id="mlyr-save" onclick="mlyrSave()">✓ Save Lyric</button>
    <button id="mlyr-cancel" onclick="mlyrClose()">Cancel</button>
  </div>

  <div id="mlyr-list-wrap">
    <div id="mlyr-list-head">
      All Lyrics <span id="mlyr-count"></span>
    </div>
    <div id="mlyr-list-rows"></div>
  </div>
</div>

<script id="mobLyrFixScript">
(function(){
'use strict';

/* ── helpers ── */
const g = id => document.getElementById(id);
const fmt = s => { s=Math.max(0,+s||0); return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; };
let _pendingT = null;

/* ═══════════════════════════════════
   BUILD MOBILE LYRICS SHEET CONTENT
═══════════════════════════════════ */
function buildMobSheet(){
  /* only on mobile */
  if(window.innerWidth > 768) return;

  const body = g('bs-lyrics')?.querySelector('.bs-body');
  if(!body || g('mob-lyr-player')) return;

  /* ── Mini player ── */
  const player = document.createElement('div');
  player.id = 'mob-lyr-player';
  player.innerHTML = `
    <button id="mob-lyr-playbtn" onclick="mlyrTogglePlay()">▶</button>
    <div id="mob-lyr-info">
      <div id="mob-lyr-clock">0:00 / 0:00</div>
      <div id="mob-lyr-bar"><div id="mob-lyr-fill"></div></div>
    </div>`;

  /* ── Stamp button ── */
  const stampBtn = document.createElement('button');
  stampBtn.id = 'mob-quick-stamp';
  stampBtn.setAttribute('onclick','mlyrStamp()');
  stampBtn.innerHTML = `
    <span id="mob-quick-stamp-icon">🎤</span>
    <span id="mob-quick-stamp-body">
      <span id="mob-quick-stamp-label">Stamp lyric here</span>
      <span id="mob-quick-stamp-hint">Press ▶ to play, then tap this button</span>
    </span>`;

  /* Insert at very top of bs-body */
  body.insertBefore(stampBtn, body.firstChild);
  body.insertBefore(player,   body.firstChild);

  /* Replace the "tap timeline" empty message */
  const le = body.querySelector('.le');
  if(le) le.innerHTML = 'Press ▶ above to play your song.<br>Tap <strong>Stamp lyric here</strong> at the right moment.';

  /* Wire scrubber */
  initMobScrubber();
}

/* ═══════════════════════════════════
   MINI PLAYER CONTROLS
═══════════════════════════════════ */
window.mlyrTogglePlay = function(){
  if(typeof togglePreview === 'function') togglePreview();
};

function initMobScrubber(){
  const bar = g('mob-lyr-bar'); if(!bar) return;
  let drag = false;
  const seek = e => {
    const r = bar.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const pct = Math.max(0,Math.min(1,(cx-r.left)/r.width));
    const dur = typeof audioDuration!=='undefined' ? audioDuration : 0;
    if(dur>0 && typeof seekPreview==='function') seekPreview(pct*dur);
  };
  bar.addEventListener('mousedown',  e=>{drag=true;seek(e);});
  bar.addEventListener('touchstart', e=>{drag=true;seek(e);},{passive:true});
  document.addEventListener('mousemove',  e=>{if(drag)seek(e);});
  document.addEventListener('touchmove',  e=>{if(drag&&e.touches)seek(e);},{passive:true});
  document.addEventListener('mouseup',    ()=>drag=false);
  document.addEventListener('touchend',   ()=>drag=false);
}

/* ── Player UI tick ── */
function playerTick(){
  requestAnimationFrame(playerTick);

  const t   = typeof pvOffset!=='undefined' ? pvOffset : 0;
  const dur = typeof audioDuration!=='undefined' && audioDuration>0 ? audioDuration : 0;
  const pct = dur>0 ? t/dur : 0;

  /* Mini player */
  const clk  = g('mob-lyr-clock');
  const fill = g('mob-lyr-fill');
  const pbtn = g('mob-lyr-playbtn');
  if(clk)  clk.textContent  = fmt(t)+' / '+(dur>0?fmt(dur):'—');
  if(fill) fill.style.width  = (pct*100)+'%';
  const playing = typeof pvPlaying!=='undefined' && pvPlaying;
  if(pbtn) pbtn.textContent  = playing ? '⏸' : '▶';

  /* Stamp hint */
  const hint = g('mob-quick-stamp-hint');
  if(hint && !g('mlyr-overlay')?.classList.contains('open')){
    if(!dur)        hint.textContent = 'Upload a song first (Upload tab)';
    else if(playing) hint.textContent = `▶ Playing ${fmt(t)} — tap to stamp now`;
    else             hint.textContent = `Paused at ${fmt(t)} — press ▶ then tap`;
  }

  /* Lyric row highlights in full-screen overlay */
  if(g('mlyr-overlay')?.classList.contains('open')){
    const lyrArr = typeof lyrics!=='undefined' ? lyrics : [];
    lyrArr.forEach((_,i)=>{
      const row = g('mlr'+i); if(!row) return;
      const l=lyrArr[i], end=l.endTime||l.time+4;
      row.classList.toggle('ml-now', t>=l.time && t<end);
    });
  }
}

/* ═══════════════════════════════════
   STAMP — open full-screen overlay
═══════════════════════════════════ */
window.mlyrStamp = function(){
  const dur = typeof audioDuration!=='undefined' && audioDuration>0 ? audioDuration : 0;
  if(!dur){
    if(typeof toast==='function') toast('⚠ Upload a song first');
    return;
  }

  /* Capture current time */
  _pendingT = typeof pvOffset!=='undefined' ? pvOffset : 0;

  /* If playing — pause so they can type without stress */
  if(typeof pvPlaying!=='undefined' && pvPlaying && typeof pausePreview==='function'){
    pausePreview();
  }

  /* Populate overlay */
  const timeTxt = g('mlyr-time-txt');
  const inp     = g('mlyr-text-in');
  if(timeTxt) timeTxt.textContent = 'at ' + fmt(_pendingT);
  if(inp) inp.value = '';

  /* Open overlay */
  g('mlyr-overlay').classList.add('open');

  /* Render current lyrics list */
  mlyrRenderList();

  /* Focus input — delayed slightly for iOS */
  setTimeout(()=>{
    const i = g('mlyr-text-in');
    if(i){ i.focus(); i.scrollIntoView({behavior:'smooth',block:'start'}); }
  }, 120);
};

/* ═══════════════════════════════════
   iOS KEYBOARD — keep save button visible
   Uses visualViewport to detect keyboard height
═══════════════════════════════════ */
function handleVP(){
  const ov = g('mlyr-overlay'); if(!ov) return;
  if(!ov.classList.contains('open')) return;

  if(window.visualViewport){
    const vvh = window.visualViewport.height;
    const vvt = window.visualViewport.offsetTop;
    ov.style.position = 'fixed';
    ov.style.top    = vvt + 'px';
    ov.style.height = vvh + 'px';
    ov.style.left   = '0';
    ov.style.right  = '0';
  }
}

if(window.visualViewport){
  window.visualViewport.addEventListener('resize', handleVP);
  window.visualViewport.addEventListener('scroll', handleVP);
}

/* Fallback for Android — resize event */
window.addEventListener('resize', handleVP);

/* ═══════════════════════════════════
   SAVE LYRIC
═══════════════════════════════════ */
window.mlyrSave = function(){
  const inp  = g('mlyr-text-in');
  const text = inp ? inp.value.trim() : '';

  if(!text){
    /* Shake the input to indicate error */
    if(inp){
      inp.style.borderColor = '#ef4444';
      inp.style.animation   = 'none';
      inp.offsetHeight; /* reflow */
      inp.style.animation   = 'mlyrShake .3s ease';
      setTimeout(()=>{ inp.style.borderColor='#7c3aed'; inp.style.animation=''; }, 800);
      inp.focus();
    }
    return;
  }

  const t   = _pendingT ?? 0;
  const dur = typeof audioDuration!=='undefined' ? audioDuration : 0;
  const nxt = typeof lyrics!=='undefined' ? lyrics.find(l=>l.time>t+0.05) : null;
  const end = dur>0 ? Math.min(dur, nxt?Math.min(nxt.time,t+4):t+4) : t+4;

  if(typeof lyrics !== 'undefined'){
    const existing = lyrics.findIndex(l=>Math.abs(l.time-t)<.3);
    if(existing>=0){
      lyrics[existing].text    = text;
      lyrics[existing].endTime = +end.toFixed(2);
    } else {
      lyrics.push({ time:+t.toFixed(2), endTime:+end.toFixed(2), text,
        ds:{beatCount:0,jumpAmt:0,spinAng:0,spinDir:1,phase:Math.random()*Math.PI*2} });
      lyrics.sort((a,b)=>a.time-b.time);
    }
  }

  if(typeof renderLyrics==='function') renderLyrics();
  if(typeof toast==='function') toast('✓ Lyric saved at '+fmt(t));

  /* Clear input and stay open so user can stamp next lyric */
  _pendingT = null;
  if(inp) inp.value = '';
  g('mlyr-time-txt').textContent = 'at —';
  g('mlyr-time-dot').style.animation = 'none';

  mlyrRenderList();

  /* Scroll list to bottom to show new lyric */
  const listWrap = g('mlyr-list-wrap');
  if(listWrap) setTimeout(()=>listWrap.scrollTo({top:listWrap.scrollHeight,behavior:'smooth'}),100);
};

/* Enter key saves (Shift+Enter for newline) */
g('mlyr-text-in')?.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); window.mlyrSave(); }
  if(e.key==='Escape') mlyrClose();
});

/* ═══════════════════════════════════
   CLOSE OVERLAY
═══════════════════════════════════ */
window.mlyrClose = function(){
  const ov = g('mlyr-overlay'); if(!ov) return;
  ov.classList.remove('open');
  /* Reset viewport fix */
  ov.style.top = ''; ov.style.height = '';
  _pendingT = null;
  /* Blur so keyboard hides */
  g('mlyr-text-in')?.blur();
};

/* ═══════════════════════════════════
   RENDER LYRICS LIST in overlay
═══════════════════════════════════ */
function mlyrRenderList(){
  const rows = g('mlyr-list-rows');
  const cnt  = g('mlyr-count');
  if(!rows) return;

  const lyrArr = typeof lyrics!=='undefined' ? lyrics : [];
  if(cnt) cnt.textContent = lyrArr.length ? `(${lyrArr.length})` : '';

  if(!lyrArr.length){
    rows.innerHTML = `<div class="ml-empty">
      No lyrics yet.<br>
      <strong>Tap "Stamp lyric here"</strong> while your song plays.
    </div>`;
    return;
  }

  rows.innerHTML = lyrArr.map((l,i)=>`
    <div class="ml-row" id="mlr${i}">
      <span class="ml-t" onclick="if(typeof seekPreview==='function')seekPreview(${l.time})">${fmt(l.time)}</span>
      <span class="ml-txt">${(l.text||'').replace(/</g,'&lt;')}</span>
      <button class="ml-del" onclick="mlyrDel(${i})">✕</button>
    </div>`).join('');
}

window.mlyrDel = function(i){
  if(typeof lyrics==='undefined') return;
  lyrics.splice(i,1);
  if(typeof renderLyrics==='function') renderLyrics();
  mlyrRenderList();
};

/* Keep overlay list in sync when main renderLyrics runs */
const _origRL = window.renderLyrics;
if(_origRL && !_origRL._mlyrWrapped){
  window.renderLyrics = function(){
    _origRL.apply(this, arguments);
    mlyrRenderList();
  };
  window.renderLyrics._mlyrWrapped = true;
}

/* Shake keyframe (added dynamically) */
const ss = document.createElement('style');
ss.textContent = `@keyframes mlyrShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}`;
document.head.appendChild(ss);

/* ═══════════════════════════════════
   INIT
═══════════════════════════════════ */
function init(){
  buildMobSheet();
  requestAnimationFrame(playerTick);

  /* Re-build if sheet is opened fresh */
  const origOpenSheet = window.openSheet;
  if(origOpenSheet && !origOpenSheet._mlyrFixed){
    window.openSheet = function(name, btn){
      origOpenSheet.apply(this, arguments);
      if(name==='lyrics') setTimeout(()=>{ buildMobSheet(); mlyrRenderList(); }, 80);
    };
    window.openSheet._mlyrFixed = true;
  }
}

if(document.readyState==='complete') setTimeout(init, 400);
else window.addEventListener('load', ()=>setTimeout(init, 400));

})();
</script>
